name: Build Pawchive (debug)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Pawchive
        run: ./gradlew :src:all:pawchive:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: pawchive-debug-apk
          path: src/all/pawchive/build/outputs/apk/debug/*.apk
